version: 2
updates:
  # Every sample's projects, wherever they sit under samples/.
  - package-ecosystem: nuget
    directories:
      - /samples/**
    schedule:
      interval: weekly
    groups:
      flowon:
        patterns: ["Flowon.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
