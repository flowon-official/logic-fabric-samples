name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Every solution under samples/ is built and tested, so a new sample needs no change here.
      - name: Build and test every sample
        shell: bash
        run: |
          set -euo pipefail
          find samples -name '*.slnx' -o -name '*.sln' | sort | while read -r solution; do
            echo "::group::$solution"
            dotnet restore "$solution"
            dotnet build "$solution" --no-restore --configuration Release
            dotnet test "$solution" --no-build --configuration Release
            echo "::endgroup::"
          done
